  <style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100vh;width:100vw;font-family:'Plus Jakarta Sans',sans-serif;background:#030303;color:#fff;overflow:hidden}.bg-canvas{position:fixed;inset:0;z-index:0;background:#050507;overflow:hidden}.bg-glow{position:absolute;width:450px;height:450px;background:radial-gradient(circle,rgba(147,51,234,.3) 0%,rgba(59,130,246,.15) 40%,transparent 70%);border-radius:50%;filter:blur(60px);animation:floatGlow 10s infinite alternate ease-in-out}.bg-glow-2{position:absolute;right:-50px;bottom:-50px;width:400px;height:400px;background:radial-gradient(circle,rgba(236,72,153,.25) 0%,transparent 70%);border-radius:50%;filter:blur(70px)}@keyframes floatGlow{0%{transform:translate(-30px,-30px) scale(1)}100%{transform:translate(40px,50px) scale(1.25)}}.intro-screen{position:fixed;inset:0;background:#050507;display:flex;justify-content:center;align-items:center;z-index:100;transition:opacity .6s cubic-bezier(.16,1,.3,1),visibility .6s ease}.intro-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}.intro-text{font-size:24px;font-weight:800;color:#fff;cursor:pointer;letter-spacing:2px;text-transform:uppercase;padding:16px 40px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.2);border-radius:50px;backdrop-filter:blur(20px);box-shadow:0 0 20px rgba(255,255,255,.25),inset 0 1px 1px rgba(255,255,255,.3);text-shadow:0 0 10px rgba(255,255,255,.9),0 0 20px rgba(255,255,255,.6),0 0 30px rgba(255,255,255,.4)}.viewport{position:relative;z-index:1;height:100vh;width:100vw;display:flex;justify-content:center;align-items:center;padding:20px;overflow-y:auto}.container{width:100%;max-width:480px;display:none;flex-direction:column;gap:14px;animation:slideUp .6s cubic-bezier(.16,1,.3,1)}@keyframes slideUp{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}.glass-card{background:linear-gradient(135deg,rgba(30,30,38,.55),rgba(15,15,20,.35));border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:20px 22px;backdrop-filter:blur(30px) saturate(200%);-webkit-backdrop-filter:blur(30px) saturate(200%);box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 1px 1px rgba(255,255,255,.2),inset 0 -1px 1px rgba(0,0,0,.4)}.profile-card{display:flex;flex-direction:column;gap:14px;position:relative}.profile-top{display:flex;justify-content:space-between;align-items:flex-start}.profile-info{display:flex;flex-direction:column;gap:6px}.profile-name{font-size:22px;font-weight:800;letter-spacing:-.3px;color:#fff;display:flex;align-items:center;gap:2px}.typing-cursor{display:inline-block;width:2px;height:20px;background:#fff;animation:blinkCursor .8s infinite;margin-left:2px;vertical-align:middle}@keyframes blinkCursor{0%,100%{opacity:1}50%{opacity:0}}.bio-text{font-size:14px;color:rgba(255,255,255,.75);margin-top:4px;line-height:1.5}.avatar-box{position:relative;width:82px;height:82px;flex-shrink:0}.avatar-img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.25);box-shadow:0 8px 20px rgba(0,0,0,.5)}.profile-bottom-row{display:flex;align-items:center;justify-content:space-between;margin-top:4px}.social-row{display:flex;gap:10px}.social-btn{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:17px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15);transition:all .2s ease}.social-btn:active{transform:scale(.92);background:rgba(255,255,255,.18)}.social-btn.ig:hover{color:#e1306c;border-color:rgba(225,48,108,.5);box-shadow:0 0 15px rgba(225,48,108,.3)}.social-btn.tt:hover{color:#fe2c55;border-color:rgba(254,44,85,.5);box-shadow:0 0 15px rgba(254,44,85,.3)}.social-btn.fb:hover{color:#1877f2;border-color:rgba(24,119,242,.5);box-shadow:0 0 15px rgba(24,119,242,.3)}.view-count-btn{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 16px;border-radius:14px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);font-size:13px;color:rgba(255,255,255,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}.view-count-btn i{font-size:12px}.view-count-num{font-weight:700;color:#fff}.badge-card{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}.badge-left{display:flex;align-items:center;gap:14px}.badge-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover}.badge-details{display:flex;flex-direction:column}.badge-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px}.badge-sub{font-size:12px;color:rgba(255,255,255,.55)}.badge-btn{padding:7px 16px;border-radius:20px;background:rgba(34,197,94,.18);border:1px solid rgba(34,197,94,.35);color:#4ade80;font-size:12px;font-weight:600;text-decoration:none}.banner-card{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}.banner-left{display:flex;align-items:center;gap:14px}.banner-icon{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:17px}.banner-title{font-size:14px;font-weight:700}.banner-sub{font-size:12px;color:rgba(255,255,255,.55)}.banner-btn{padding:7px 16px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:12px;font-weight:600;text-decoration:none}.music-card{display:flex;align-items:center;gap:14px;padding:16px 18px}.music-disc{width:45px;height:45px;border-radius:50%;background:linear-gradient(135deg,#9333ea,#3b82f6);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;box-shadow:0 0 15px rgba(147,51,234,.4);transition:transform .2s cubic-bezier(.175,.885,.32,1.275)}.music-disc.playing{animation:discPulse 1.2s infinite ease-in-out}@keyframes discPulse{0%{transform:scale(1);box-shadow:0 0 15px rgba(147,51,234,.4)}50%{transform:scale(1.08);box-shadow:0 0 25px rgba(56,239,125,.8)}100%{transform:scale(1);box-shadow:0 0 15px rgba(147,51,234,.4)}}.music-info{flex:1;min-width:0}.music-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.music-artist{font-size:12px;color:rgba(255,255,255,.55);display:flex;align-items:center;gap:4px;margin-top:2px}.music-time{font-size:12px;color:rgba(255,255,255,.45);font-family:monospace}.progress-bar{width:100%;height:4px;background:rgba(255,255,255,.12);border-radius:2px;margin-top:6px;overflow:hidden;cursor:pointer}.progress-fill{width:0%;height:100%;background:#a855f7;transition:width .05s linear}.audio-toggle-btn{position:fixed;top:22px;right:22px;z-index:999;display:none;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:rgba(20,20,25,.65);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 8px 24px rgba(0,0,0,.4);color:#fff;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .3s cubic-bezier(.16,1,.3,1);outline:0;user-select:none}.audio-toggle-btn.playing{border-color:rgba(56,239,125,.6);box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 20px rgba(56,239,125,.25)}.audio-toggle-btn:hover{background:rgba(35,35,45,.85);border-color:rgba(56,239,125,.8);transform:translateY(-2px) scale(1.03)}.audio-bars{display:flex;align-items:flex-end;gap:2.5px;height:12px;width:14px}.audio-bar{width:2.5px;background:#aaa;border-radius:1px;height:4px;transition:height .2s ease}.audio-toggle-btn.playing .audio-bar{background:#38ef7d;animation:soundWave .8s infinite ease-in-out alternate}.audio-toggle-btn.playing .audio-bar:nth-child(1){animation-delay:0s}.audio-toggle-btn.playing .audio-bar:nth-child(2){animation-delay:.3s}.audio-toggle-btn.playing .audio-bar:nth-child(3){animation-delay:.15s}@keyframes soundWave{0%{height:3px}100%{height:12px}}.copyright-row{text-align:center;font-size:12px;color:rgba(255,255,255,.4);margin-top:2px;letter-spacing:1px}.copyright-row span{color:rgba(255,255,255,.8);font-weight:600;letter-spacing:1.2px}.heart-beat{color:#fff;font-size:10px;display:inline-block;animation:heartBeat 1.2s infinite ease-in-out;filter:drop-shadow(0 0 4px rgba(255,255,255,0.8))}@keyframes heartBeat{0%,100%{transform:scale(1)}15%,30%{transform:scale(1.35)}45%{transform:scale(1)}}
  </style>
</head>
<body>
  <div class="bg-canvas"><div class="bg-glow" style="top:15%;left:20%"></div><div class="bg-glow-2"></div></div>
  <div class="intro-screen" id="introScreen" onclick="enterSite()"><div class="intro-text">᥊꠸ꪀ ᥴꫝꪖꪮ</div></div>
  <audio id="backgroundAudio" loop preload="auto"><source src="Wrong Times.mp3" type="audio/mpeg"></audio>
  <button class="audio-toggle-btn" id="audioControl" onclick="togglePlay()"><div class="audio-bars"><div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div></div><span id="audioText">Music</span></button>
  <div class="viewport">
    <div class="container" id="mainContent">
      <div class="glass-card profile-card">
        <div class="profile-top">
          <div class="profile-info">
            <div class="profile-name"><span id="typedName"></span><span class="typing-cursor" id="typingCursor"></span></div>
            <div class="bio-text">你 / em <br>a b c d x y z n m a s a d</div>
          </div>
          <div class="avatar-box"><img class="avatar-img" src="https://cdn.discordapp.com/attachments/1554206356490428542/1568930424833445918/att.85BKB6YWRLoCUzJVRBYzgd3m4evehbZPbhHn9RbaNlQ.jpg?ex=6af19bd2&is=6af04a52&hm=6277c716da13827678e6484e5f6ce9ce0b98fbc374e366b64e6435df4a4a4bac&"></div>
        </div>
        <div class="profile-bottom-row">
          <div class="social-row">
            <a class="social-btn ig" href="https://www.instagram.com/cuongbeooilabeo" target="_blank" rel="noopener"><i class="fab fa-instagram"></i></a>
            <a class="social-btn tt" href="https://www.tiktok.com/@muadongincheon" target="_blank" rel="noopener"><i class="fab fa-tiktok"></i></a>
            <a class="social-btn fb" href="https://www.facebook.com/youngparysdasick" target="_blank" rel="noopener"><i class="fab fa-facebook-f"></i></a>
          </div>
          <div class="view-count-btn"><i class="far fa-eye"></i> <span class="view-count-num" id="viewCount">1</span></div>
        </div>
      </div>
      <div class="glass-card badge-card">
        <div class="badge-left">
          <img class="badge-avatar" src="https://cdn.discordapp.com/attachments/1554206356490428542/1568931006621417542/IMG_6545.png?ex=6af19c5d&is=6af04add&hm=1f80ea086a141b46e0d3673763f3866f2f62314423d53a05ef60c6592810759f&" alt="Avatar">
          <div class="badge-details"><div class="badge-title">Peo <i class="fas fa-check-circle" style="color:#3b82f6;font-size:12px"></i></div><div class="badge-sub">if you.</div></div>
        </div>
        <a href="https://www.github.com/p4ryx" target="_blank" rel="noopener" class="badge-btn">View Profile</a>
      </div>
      <div class="glass-card banner-card">
        <div class="banner-left">
          <div class="banner-icon"><i class="fas fa-globe"></i></div>
          <div class="banner-details"><div class="banner-title">nguyenthuynhan.xyz</div><div class="banner-sub">Viet Nam</div></div>
        </div>
        <a href="#" class="banner-btn">toideptrai.site</a>
      </div>
      <div class="glass-card music-card">
        <div class="music-disc" id="musicDisc" onclick="togglePlay()"><i class="fas fa-play" id="playIcon" style="font-size:13px;color:#fff"></i></div>
        <div class="music-info">
          <div class="music-title" id="trackTitle"></div>
          <div class="music-artist"><i class="fas fa-volume-up" style="font-size:10px"></i> Dangrangto - Puppy</div>
          <div class="progress-bar" id="progressBar" onclick="seekAudio(event)"><div class="progress-fill" id="progress"></div></div>
        </div>
        <div class="music-time" id="timeDisplay"></div>
      </div>
      <div class="copyright-row">Made with <i class="fas fa-heart heart-beat"></i> <span>: muadongincheon</span></div>
    </div>
  </div>
  <script>
    const $=i=>document.getElementById(i),audio=$('backgroundAudio');
    function updateUI(p){$('playIcon').className=p?'fas fa-pause':'fas fa-play';$('audioText').textContent=p?'Playing':'Muted';$('audioControl').classList.toggle('playing',p);$('musicDisc').classList.toggle('playing',p)}
    function startTypingEffect(){const t="iu 𝘕𝘨𝘶𝘺𝘦𝘯 𝘘𝘶𝘰𝘤 𝘊𝘶𝘰𝘯𝘨";let i=0,tg=$('typedName');tg.textContent="";$('typingCursor').style.display='inline-block';(function type(){if(i<t.length){tg.textContent+=t.charAt(i++);setTimeout(type,180)}else{setTimeout(()=>{i=0;tg.textContent="";type()},2500)}})()}
    const formatTime=s=>isNaN(s)||s===Infinity?"0:00":`${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`;
    function setupTrackName(){try{$('trackTitle').textContent=decodeURIComponent(audio.querySelector('source').src.split('/').pop().split('?')[0]).replace(/\.[^/.]+$/,"")}catch(e){$('trackTitle').textContent="Audio Track"}}
    function initViewCount(){const k="muadongincheon_profile_views";fetch(`https://hits.seeyoufarm.com/api/count/incr/badge.json?url=${encodeURIComponent(window.location.origin+window.location.pathname)}&count_bg=%237928CA&title_bg=%23555555&icon=&icon_color=%23E7E7E7&title=hits&edge_flat=false`).then(r=>r.json()).then(d=>{if(d&&d.value)$('viewCount').textContent=d.value;else throw new Error()}).catch(()=>{let v=parseInt(localStorage.getItem(k)||"0")+1;localStorage.setItem(k,v);$('viewCount').textContent=v})}
    function enterSite(){setupTrackName();$('introScreen').classList.add('hidden');$('mainContent').style.display='flex';$('audioControl').style.display='inline-flex';startTypingEffect();initViewCount();audio.volume=0.5;audio.play().catch(e=>console.log('Autoplay blocked:',e))}
    function togglePlay(){audio.paused?audio.play():audio.pause()}
    function seekAudio(e){const r=$('progressBar').getBoundingClientRect();if(audio.duration)audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration}
    audio.onplay=()=>updateUI(true);audio.onpause=()=>updateUI(false);audio.onended=()=>updateUI(false);
    audio.onloadedmetadata=()=>$('timeDisplay').textContent=`${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
    audio.ontimeupdate=()=>{if(audio.duration){$('progress').style.width=(audio.currentTime/audio.duration)*100+'%';$('timeDisplay').textContent=`${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`}};
    document.addEventListener('DOMContentLoaded',setupTrackName);
  </script>
</body>
